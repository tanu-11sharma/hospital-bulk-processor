# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: hospital-bulk-processor
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: HOSPITAL_API_BASE_URL
        value: https://hospital-directory.onrender.com
      - key: MAX_CONCURRENCY
        value: "5"
      - key: MAX_RETRIES
        value: "4"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "60"
